<text x="650.0" y="40" font-size="24" font-weight="800" text-anchor="middle" fill="#0F172A">규제검증 &amp; 점수 알고리즘 아키텍처</text>
<text x="650.0" y="62" font-size="13" text-anchor="middle" fill="#94A3B8">Commerce AdPilot · backend/regulations — 현재 구현 기준 (Layer 2 LLM 심의관 연동 완료 · 수동 피드백 재생성 루프 추가)</text>

<text x="70" y="80" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94A3B8">① 입력</text>
<rect x="70" y="90" width="540" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="70" y="90" width="6" height="92" rx="3" fill="#3B82F6"/>
<text x="92" y="118" font-size="14" font-weight="700" fill="#1E293B">개별 생성</text>
<text x="92" y="140" font-size="12.5" fill="#475569">input 페이지 폼 입력</text>
<text x="92" y="159" font-size="12.5" fill="#475569">POST /api/generate/platform</text>
<text x="92" y="178" font-size="12.5" fill="#475569">채널별로 _generate_checked() 병렬 호출</text>
<rect x="690" y="90" width="540" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="690" y="90" width="6" height="92" rx="3" fill="#3B82F6"/>
<text x="712" y="118" font-size="14" font-weight="700" fill="#1E293B">CSV 업로드</text>
<text x="712" y="140" font-size="12.5" fill="#475569">input 페이지 모달 (.csv/.xlsx)</text>
<text x="712" y="159" font-size="12.5" fill="#475569">POST /api/generate/csv</text>
<text x="712" y="178" font-size="12.5" fill="#475569">행마다 _generate_checked() 호출 (동기/비동기)</text>
