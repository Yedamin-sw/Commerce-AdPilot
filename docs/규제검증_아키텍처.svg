<rect x="60" y="1936" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="90" y="1952" font-size="12.5" fill="#475569">자동 파이프라인 (①~⑤, 생성할 때마다 항상 실행)</text>
<rect x="430" y="1936" width="22" height="22" rx="5" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<text x="460" y="1952" font-size="12.5" fill="#475569">수동 트리거 — 사용자가 버튼을 눌러야만 실행 (⑥)</text>
